name: Main CI

on:
  push:
    branches:
      - main

jobs:
  build-sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift test
        run: swift test --parallel

      - name: Codesign (dry-run)
        env:
          DRY_RUN: "1"
        run: bash Scripts/sign.sh --dry-run

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .build/**/*.xccovreport
          if-no-files-found: ignore
