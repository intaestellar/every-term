name: PR Build & Test

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift test (parallel)
        run: swift test --parallel

      - name: Coverage summary
        if: success()
        run: |
          swift test --enable-code-coverage || true
